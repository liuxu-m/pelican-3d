<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>鹈鹕骑自行车 · Pelican Rides a Bicycle — WebGL 3D</title>
<meta name="description" content="A fully procedural 3D pelican riding a bicycle through an endless coastal landscape. Built with Three.js — zero external assets." />
<meta name="theme-color" content="#0b1020" />
<meta property="og:title" content="鹈鹕骑自行车 · Pelican Rides a Bicycle" />
<meta property="og:description" content="Procedural WebGL pelican + bicycle + endless world. Three.js, no assets." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%A5%3C/text%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#070b16; --panel:rgba(14,20,36,.62); --line:rgba(255,255,255,.14);
    --txt:#eaf0ff; --dim:#93a2c4; --accent:#ffcf5c; --accent2:#5ce1ff; --good:#5cf2a8;
    --shadow:0 18px 50px -18px rgba(0,0,0,.85);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:Inter,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  canvas#scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}

  /* ---------- layer stack ---------- */
  .layer{position:fixed;inset:0;pointer-events:none;z-index:10}
  .layer > *{pointer-events:auto}

  /* ---------- title ---------- */
  #brand{position:fixed;top:20px;left:22px;z-index:20;pointer-events:none;max-width:min(46vw,540px)}
  #brand h1{margin:0;font-size:clamp(19px,2.6vw,34px);font-weight:900;letter-spacing:-.02em;line-height:1.08;
    background:linear-gradient(100deg,#fff 0%,var(--accent) 45%,var(--accent2) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
    filter:drop-shadow(0 4px 20px rgba(255,207,92,.22))}
  #brand p{margin:6px 0 0;font-size:clamp(10px,1.05vw,12.5px);color:var(--dim);letter-spacing:.16em;text-transform:uppercase;font-weight:600}
  #brand .tag{margin-top:9px;display:inline-flex;gap:6px;align-items:center;font-size:11px;color:#cfe0ff;
    background:rgba(9,15,30,.6);border:1px solid var(--line);padding:4px 10px;border-radius:999px;backdrop-filter:blur(10px)}
  #brand .tag b{color:var(--good);font-weight:700}

  /* ---------- panel ---------- */
  #panel{position:fixed;left:20px;bottom:20px;z-index:20;width:282px;padding:12px 13px 11px;
    max-height:calc(100vh - 40px);overflow-y:auto;overscroll-behavior:contain;
    background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
    backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
    transition:transform .34s cubic-bezier(.3,1,.4,1),opacity .3s}
  #panel.hidden{transform:translateY(130%);opacity:0}
  button.b i{line-height:1}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
  .lbl{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .val{font-size:11.5px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:9px}
  button.b{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--txt);
    font:inherit;font-size:10.5px;font-weight:600;padding:6px 3px;border-radius:9px;cursor:pointer;
    transition:.18s;display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.1}
  button.b i{font-style:normal;font-size:14px;opacity:.95}
  button.b:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}
  button.b:active{transform:translateY(0) scale(.97)}
  button.b.on{background:linear-gradient(160deg,rgba(255,207,92,.28),rgba(92,225,255,.18));
    border-color:rgba(255,207,92,.55);color:#fff;box-shadow:0 0 0 1px rgba(255,207,92,.2),0 6px 20px -8px rgba(255,207,92,.7)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));outline:none;margin:2px 0 8px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:#fff;border:2px solid #0b1020;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.6)}
  input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#fff;border:2px solid #0b1020;cursor:pointer}
  .hint{font-size:9.5px;color:var(--dim);line-height:1.5;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
  kbd{font:inherit;font-size:9.5px;background:rgba(255,255,255,.1);border:1px solid var(--line);
    border-bottom-width:2px;border-radius:5px;padding:1px 5px;font-weight:700}

  /* ---------- hud ---------- */
  #hud{position:fixed;right:22px;bottom:22px;z-index:20;display:flex;gap:8px;align-items:flex-end}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:9px 13px;
    backdrop-filter:blur(18px);box-shadow:var(--shadow);text-align:right;min-width:74px}
  .chip .k{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
  .chip .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .chip .v small{font-size:10px;color:var(--dim);font-weight:600}

  /* ---------- top-right actions ---------- */
  #actions{position:fixed;top:20px;right:22px;z-index:20;display:flex;gap:8px}
  .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(18px);color:var(--txt);
    font-size:16px;transition:.18s;box-shadow:var(--shadow)}
  .ic:hover{background:rgba(255,255,255,.14);transform:translateY(-2px)}
  .ic.on{border-color:rgba(92,242,168,.6);color:var(--good)}

  /* ---------- loader ---------- */
  #loader{position:fixed;inset:0;z-index:60;display:grid;place-items:center;
    background:radial-gradient(1200px 700px at 50% 40%,#141d38 0%,#070b16 62%);
    transition:opacity .7s ease,visibility .7s}
  #loader.done{opacity:0;visibility:hidden}
  .wrap{text-align:center;width:min(84vw,360px)}
  .bird{font-size:62px;line-height:1;animation:pedal 1.05s linear infinite;display:inline-block;transform-origin:60% 75%}
  @keyframes pedal{0%{transform:translateY(0) rotate(-3.5deg)}50%{transform:translateY(-7px) rotate(3.5deg)}100%{transform:translateY(0) rotate(-3.5deg)}}
  .wrap h2{margin:16px 0 3px;font-size:16px;font-weight:800;letter-spacing:-.01em}
  .wrap p{margin:0 0 18px;font-size:11.5px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;font-weight:600}
  .bar{height:4px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
  .bar span{display:block;height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s ease}
  #stat{margin-top:11px;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;height:14px}

  /* ---------- toast ---------- */
  #toast{position:fixed;left:50%;transform:translate(-50%,140%);bottom:34px;z-index:30;
    background:rgba(9,15,30,.85);border:1px solid var(--line);border-radius:12px;padding:9px 16px;
    font-size:12px;font-weight:600;backdrop-filter:blur(14px);transition:transform .4s cubic-bezier(.3,1.4,.5,1);white-space:nowrap}
  #toast.show{transform:translate(-50%,0)}
  #err{position:fixed;inset:auto 16px 16px;z-index:70;background:rgba(60,10,20,.92);border:1px solid #ff6b81;
    border-radius:12px;padding:12px 14px;font:12px ui-monospace,Consolas,monospace;color:#ffd9df;display:none;max-height:34vh;overflow:auto;white-space:pre-wrap}
  #panelToggle{display:none}
  @media (max-width:820px){
    #panel{width:calc(100vw - 32px);left:16px;bottom:16px}
    #hud{bottom:auto;top:78px;right:16px;flex-direction:column;align-items:flex-end}
    #brand{left:16px;top:14px;max-width:62vw}
    #actions{right:16px;top:14px}
    .ic{width:36px;height:36px;font-size:14px}
    #panelToggle{display:grid}
  }
  @media (prefers-reduced-motion:reduce){.bird{animation:none}}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="brand">
  <h1>鹈鹕骑自行车</h1>
  <p>Pelican Rides a Bicycle</p>
  <div class="tag"><b>●</b> 100% 程序化生成 · 零外部素材 · Three.js WebGL</div>
</div>

<div id="actions">
  <div class="ic" id="btnPanel" title="收起/展开控制台 (H)">☰</div>
  <div class="ic" id="btnShot" title="保存截图 (S)">⛶</div>

</div>

<div id="panel">
  <div class="row"><span class="lbl">Camera</span><span class="val" id="vCam">Orbit</span></div>

    拖拽旋转 · 滚轮缩放 · <kbd>H</kbd>面板 <kbd>S</kbd>截图 <kbd>F</kbd>全屏 <kbd>空格</kbd>暂停 <kbd>1</kbd>–<kbd>6</kbd>机位 <kbd>←</kbd><kbd>→</kbd>时间 <kbd>N</kbd>昼夜
  </div>
</div>

<div id="hud">
  <div class="chip"><div class="k">Speed</div><div class="v" id="hSpeed">18<small> km/h</small></div></div>

  <div class="chip"><div class="k">Tris</div><div class="v" id="hTris">–</div></div>
</div>

<div id="toast"></div>
<div id="err"></div>

<div id="loader">
  <div class="wrap">
    <span class="bird">🐦</span>
    <h2>正在孵化鹈鹕…</h2>
    <p>Hatching a pelican</p>
    <div class="bar"><span id="barFill"></span></div>
    <div id="stat">初始化渲染器</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }    from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }   from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }       from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass }       from 'three/addons/postprocessing/ShaderPass.js';
import { Pass, FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
import { OutputPass }       from 'three/addons/postprocessing/OutputPass.js';
import { Sky }              from 'three/addons/objects/Sky.js';
import { RoomEnvironment }  from 'three/addons/environments/RoomEnvironment.js';

/* ============================================================================
   0 · BOOT / ERROR SURFACE
   ========================================================================== */
const $  = (s) => document.querySelector(s);
const barFill = $('#barFill'), statEl = $('#stat'), errEl = $('#err');
const STEPS = ['初始化渲染器','构建鹈鹕骨骼','焊接自行车','生成贴图','布置世界','烘焙环境光','编译着色器','准备就绪'];
let _step = 0;
function progress(i, msg){
  _step = i;
  barFill.style.width = Math.round(((i+1)/STEPS.length)*100) + '%';
  statEl.textContent = msg || STEPS[i] || '';
}
function fatal(e){
  console.error(e);
  errEl.style.display = 'block';
  errEl.textContent = '⚠ 运行错误\n' + (e && e.stack ? e.stack : String(e));
  document.getElementById('loader').classList.add('done');
}
window.addEventListener('error', (ev) => { if (ev.error) fatal(ev.error); });
window.addEventListener('unhandledrejection', (ev) => fatal(ev.reason));

/* ============================================================================
   1 · MATH + PROCEDURAL GEOMETRY TOOLKIT
   ========================================================================== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp  = (a, b, t) => a + (b - a) * t;
const smooth= (t) => t * t * (3 - 2 * t);
const damp  = (a, b, l, dt) => lerp(a, b, 1 - Math.exp(-l * dt));

/** Deterministic PRNG so the world is identical on every reload. */
function mulberry(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const RNG = mulberry(20240617);
const rand = (a = 0, b = 1) => a + RNG() * (b - a);

/** Closed tapered tube swept along a Curve — used for the pelican's neck. */
function taperedTube(curve, radiusFn, tubSeg = 72, radSeg = 14){
  const frames = curve.computeFrenetFrames(tubSeg, false);
  const pos = [], nor = [], uvs = [], idx = [];
  for (let i = 0; i <= tubSeg; i++){
    const t = i / tubSeg;
    const P = curve.getPointAt(t), N = frames.normals[i], B = frames.binormals[i];
    const r = radiusFn(t);
    for (let j = 0; j <= radSeg; j++){
      const v = (j / radSeg) * TAU, s = Math.sin(v), c = -Math.cos(v);
      const nx = c * N.x + s * B.x, ny = c * N.y + s * B.y, nz = c * N.z + s * B.z;
      nor.push(nx, ny, nz);
      pos.push(P.x + r * nx, P.y + r * ny, P.z + r * nz);
      uvs.push(t, j / radSeg);
    }
  }
  for (let i = 1; i <= tubSeg; i++) for (let j = 1; j <= radSeg; j++){
    const a = (radSeg + 1) * (i - 1) + (j - 1), b = (radSeg + 1) * i + (j - 1);
    const c = (radSeg + 1) * i + j, d = (radSeg + 1) * (i - 1) + j;
    idx.push(a, b, d, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setIndex(idx);
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  return g;
}

/** Free-form parametric surface: (u,v) in [0,1]^2 -> point. */
function paramSurface(fn, uSeg, vSeg){
  const pos = [], uvs = [], idx = [];
  for (let i = 0; i <= uSeg; i++){
    const u = i / uSeg;
    for (let j = 0; j <= vSeg; j++){
      const v = j / vSeg, P = fn(u, v);
      pos.push(P.x, P.y, P.z); uvs.push(u, v);
    }
  }
  for (let i = 1; i <= uSeg; i++) for (let j = 1; j <= vSeg; j++){
    const a = (vSeg + 1) * (i - 1) + (j - 1), b = (vSeg + 1) * i + (j - 1);
    const c = (vSeg + 1) * i + j, d = (vSeg + 1) * (i - 1) + j;
    idx.push(a, b, d, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setIndex(idx);
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.computeVertexNormals();
  g.computeBoundingSphere();
  return g;
}

/** Cylinder spanning two points — the bicycle frame is built from these. */
function strut(a, b, r, mat, seg = 10, cap = true){
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg, 1, !cap), mat);
  m.position.copy(a).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
/** Live-updating limb: rebuilt each frame from two world points. */
function makeLimb(r, mat, seg = 12){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, seg, 1, false), mat);
  m.castShadow = true; m.receiveShadow = true;
  m.userData.r = r;
  m.pose = (a, b, bulge = 1) => {
    const dir = new THREE.Vector3().subVectors(b, a), len = dir.length();
    m.position.copy(a).addScaledVector(dir, 0.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
    m.scale.set(r, Math.max(len, 1e-4), r * bulge);
  };
  return m;
}

/** Analytic two-bone IK in the XY plane — drives the pedalling legs. */
function solveIK(hip, foot, l1, l2, bend = 1){
  const dx = foot.x - hip.x, dy = foot.y - hip.y;
  let d = Math.hypot(dx, dy);
  d = clamp(d, Math.abs(l1 - l2) + 1e-3, l1 + l2 - 1e-3);
  const base = Math.atan2(dy, dx);
  const cosA = clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1);
  const A = Math.acos(cosA) * bend;
  return { x: hip.x + Math.cos(base + A) * l1, y: hip.y + Math.sin(base + A) * l1 };
}

/** Canvas 2D -> CanvasTexture, the source of every "texture" in the scene. */
function canvasTex(size, draw, opts = {}){
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  draw(g, size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = opts.srgb === false ? THREE.NoColorSpace : THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (opts.repeat) t.repeat.set(opts.repeat[0], opts.repeat[1]);
  return t;
}


/* ============================================================================
   2 · PALETTE · PROCEDURAL TEXTURES · MATERIALS
   ========================================================================== */
progress(3, '生成贴图');

const featherTex = canvasTex(512, (g, S) => {
  g.fillStyle = '#fdf8ee'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 1200; i++){
    g.globalAlpha = rand(0.015, 0.06);
    g.fillStyle = RNG() > 0.5 ? '#e4d9c2' : '#ffffff';
    g.beginPath(); g.arc(RNG() * S, RNG() * S, rand(2, 16), 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
  const rowH = 25, colW = 21;
  for (let row = -1; row < S / rowH + 1; row++){
    for (let col = -1; col < S / colW + 1; col++){
      const x = col * colW + (row & 1 ? colW / 2 : 0), y = row * rowH;
      g.save(); g.translate(x, y);
      g.beginPath(); g.moveTo(0, 0);
      g.quadraticCurveTo(colW * 0.5, -rowH * 0.58, colW, 0);
      g.quadraticCurveTo(colW * 0.5, rowH * 0.66, 0, 0);
      g.closePath();
      g.fillStyle = 'rgba(255,255,255,0.18)'; g.fill();
      g.strokeStyle = 'rgba(150,134,106,0.32)'; g.lineWidth = 1.05; g.stroke();
      g.restore();
    }
  }
}, { repeat: [3, 2] });

const pouchTex = canvasTex(256, (g, S) => {
  const grad = g.createLinearGradient(0, 0, 0, S);
  grad.addColorStop(0, '#ffd28a'); grad.addColorStop(0.55, '#ff9d4d'); grad.addColorStop(1, '#f2603f');
  g.fillStyle = grad; g.fillRect(0, 0, S, S);
  g.strokeStyle = 'rgba(214,84,52,0.30)';
  for (let i = 0; i < 34; i++){
    g.lineWidth = rand(0.6, 1.7); g.beginPath();
    const y = RNG() * S, x = RNG() * S;
    g.moveTo(x, y);
    g.bezierCurveTo(x + rand(-22, 22), y + 24, x + rand(-22, 22), y + 52, x + rand(-18, 18), y + 78);
    g.stroke();
  }
  for (let i = 0; i < 400; i++){
    g.globalAlpha = rand(0.02, 0.07); g.fillStyle = '#7d2a12';
    g.beginPath(); g.arc(RNG() * S, RNG() * S, rand(1, 5), 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
});

const barkTex = canvasTex(256, (g, S) => {
  g.fillStyle = '#c9a06a'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 240; i++){
    g.strokeStyle = 'rgba(96,66,38,' + rand(0.05, 0.3).toFixed(2) + ')';
    g.lineWidth = rand(1, 5);
    const x = RNG() * S;
    g.beginPath(); g.moveTo(x, -10); g.lineTo(x + rand(-8, 8), S + 10); g.stroke();
  }
});

const M = {
  feather : new THREE.MeshStandardMaterial({ color: 0xffffff, map: featherTex, bumpMap: featherTex, bumpScale: 0.014, roughness: 0.84, metalness: 0.02 }),
  wingTip : new THREE.MeshStandardMaterial({ color: 0x77879e, roughness: 0.72, metalness: 0.05 }),
  beak    : new THREE.MeshStandardMaterial({ color: 0xffb03a, roughness: 0.36, metalness: 0.06 }),
  pouch   : new THREE.MeshStandardMaterial({ color: 0xffffff, map: pouchTex, roughness: 0.34, metalness: 0.03, side: THREE.DoubleSide }),
  skin    : new THREE.MeshStandardMaterial({ color: 0xff9d2e, roughness: 0.52, metalness: 0.03 }),
  eyeInk  : new THREE.MeshStandardMaterial({ color: 0x0a0c12, roughness: 0.12, metalness: 0.2 }),
  eyeWhite: new THREE.MeshStandardMaterial({ color: 0xfbfcff, roughness: 0.2 }),
  frame   : new THREE.MeshStandardMaterial({ color: 0xe4503c, roughness: 0.26, metalness: 0.62 }),
  chrome  : new THREE.MeshStandardMaterial({ color: 0xdde5ef, roughness: 0.16, metalness: 1.0 }),
  rubber  : new THREE.MeshStandardMaterial({ color: 0x16181f, roughness: 0.92, metalness: 0.03 }),
  helmet  : new THREE.MeshStandardMaterial({ color: 0xf3f6fb, roughness: 0.3,  metalness: 0.12 }),
  scarf   : new THREE.MeshStandardMaterial({ color: 0xe23b3b, roughness: 0.78, side: THREE.DoubleSide }),
  fish    : new THREE.MeshStandardMaterial({ color: 0x9ed9ea, roughness: 0.35, metalness: 0.15, side: THREE.DoubleSide }),
  wood    : new THREE.MeshStandardMaterial({ map: barkTex, roughness: 0.95 }),
};

/* ============================================================================
   3 · THE PELICAN  — every part is built from primitives & parametric surfaces
   ========================================================================== */
progress(1, '构建鹈鹕骨骼');

/** Hip joints, in rig space. Legs are solved to the pedals each frame. */
const HIP_L = new THREE.Vector3(-0.19, 1.03,  0.140);
const HIP_R = new THREE.Vector3(-0.19, 1.03, -0.140);
const THIGH = 0.43, SHIN = 0.46;

function buildPelican(){
  const group = new THREE.Group();
  const refs = { group };

  /* ---- body: an egg-shaped sphere with the belly flattened ---- */
  const bodyGeo = new THREE.SphereGeometry(1, 48, 34);
  {
    const p = bodyGeo.attributes.position, v = new THREE.Vector3();
    const RX = 0.46, RY = 0.40, RZ = 0.365;
    for (let i = 0; i < p.count; i++){
      v.fromBufferAttribute(p, i);
      let x = v.x * RX, y = v.y * RY, z = v.z * RZ;
      const t = (v.y + 1) / 2;
      z *= 1 + 0.06 * Math.sin(t * Math.PI);            // rounder shoulders
      x *= 1 - 0.13 * Math.max(0, -v.y);                // narrower toward the belly
      y += (1 - v.y * v.y) * 0.05;                      // egg bias
      if (v.y < -0.5) y = lerp(y, -RY * 0.66, (-v.y - 0.5) / 0.5 * 0.7);
      p.setXYZ(i, x, y, z);
    }
    bodyGeo.computeVertexNormals();
  }
  const body = new THREE.Mesh(bodyGeo, M.feather);
  body.position.set(-0.16, 1.42, 0); body.rotation.z = -0.13;
  body.castShadow = body.receiveShadow = true;
  group.add(body);

  /* ---- tail: five fanned blades ---- */
  const tail = new THREE.Group();
  tail.position.set(-0.56, 1.46, 0); tail.rotation.z = 0.30;
  for (let i = -2; i <= 2; i++){
    const g = new THREE.BoxGeometry(0.5, 0.035, 0.10);
    const m = new THREE.Mesh(g, M.feather);
    m.position.set(-0.22, 0, i * 0.075);
    m.rotation.y = i * 0.30; m.rotation.z = -0.18 - Math.abs(i) * 0.05;
    m.castShadow = true; tail.add(m);
  }
  group.add(tail);

  /* ---- neck: a tapered tube swept along a hand-placed spline ---- */
  const neckCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3( 0.02, 1.50, 0),
    new THREE.Vector3( 0.24, 1.66, 0),
    new THREE.Vector3( 0.33, 1.86, 0),
    new THREE.Vector3( 0.30, 2.01, 0),
    new THREE.Vector3( 0.44, 2.10, 0),
    new THREE.Vector3( 0.55, 2.11, 0),
  ], false, 'catmullrom', 0.4);
  const neckGeo = taperedTube(neckCurve, (t) => 0.215 * (1 - t) + 0.105 * t + 0.022 * Math.sin(t * Math.PI), 80, 16);
  const neck = new THREE.Mesh(neckGeo, M.feather);
  neck.castShadow = neck.receiveShadow = true;
  group.add(neck);

  /* ---- head ---- */
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.185, 40, 28), M.feather);
  head.position.set(0.585, 2.115, 0); head.scale.set(1.05, 0.98, 0.95);
  head.castShadow = head.receiveShadow = true;
  group.add(head);

  /* ---- upper mandible: a long tapered wedge ---- */
  const beakLen = 0.78;
  const mandible = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.095, beakLen, 10, 6, false), M.beak);
  mandible.position.set(0.60 + beakLen / 2, 2.085, 0);
  mandible.rotation.z = -Math.PI / 2;
  mandible.scale.set(1, 1, 0.62);
  mandible.castShadow = true;
  group.add(mandible);
  const beakTip = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.10, 8), M.beak);
  beakTip.position.set(0.60 + beakLen + 0.03, 2.085, 0);
  beakTip.rotation.z = -Math.PI / 2; beakTip.scale.set(1, 1, 0.62);
  group.add(beakTip);

  /* ---- the gular pouch: a sagging parametric membrane ---- */
  const A = new THREE.Vector3(0.635, 2.055, 0), B = new THREE.Vector3(1.335, 2.015, 0);
  const pouchGeo = paramSurface((u, v) => {
    const vv = v * 2 - 1;                                  // symmetric across the mandible
    const cx = lerp(A.x, B.x, u), cy = lerp(A.y, B.y, u);
    const w = 0.092 * (1 - 0.30 * u) * (1 - 0.55 * Math.max(0, u - 0.86) / 0.14);
    const sag = 0.255 * Math.sin(Math.PI * Math.pow(u, 0.78)) * (1 - 0.18 * u);
    const k = 1 - vv * vv;
    return new THREE.Vector3(cx - 0.05 * sag * k, cy - sag * k, vv * w * (0.50 + 0.50 * k));
  }, 36, 20);
  const pouch = new THREE.Mesh(pouchGeo, M.pouch);
  pouch.castShadow = true;
  group.add(pouch);
  refs.pouch = pouch;

  /* ---- a fish that did not get away ---- */
  const fish = new THREE.Group();
  fish.position.set(1.00, 1.945, 0.055);
  const fbody = new THREE.Mesh(new THREE.CapsuleGeometry(0.035, 0.12, 4, 10), M.fish);
  fbody.rotation.z = Math.PI / 2; fish.add(fbody);
  const ftail = new THREE.Mesh(new THREE.ConeGeometry(0.055, 0.10, 4), M.fish);
  ftail.position.set(0.11, 0, 0); ftail.rotation.z = -Math.PI / 2; ftail.scale.set(1, 1, 0.35); fish.add(ftail);
  fish.rotation.z = -0.55; fish.castShadow = true;
  group.add(fish);
  refs.fish = fish;

  /* ---- eyes, with a slightly unhinged expression ---- */
  for (const s of [1, -1]){
    const w = new THREE.Mesh(new THREE.SphereGeometry(0.064, 20, 16), M.eyeWhite);
    w.position.set(0.612, 2.176, s * 0.112); w.scale.set(1, 1, 0.62); group.add(w);
    const ir = new THREE.Mesh(new THREE.SphereGeometry(0.040, 18, 14), M.eyeInk);
    ir.position.set(0.660, 2.171, s * 0.152); ir.scale.set(0.86, 0.86, 0.5); group.add(ir);
    const gl = new THREE.Mesh(new THREE.SphereGeometry(0.013, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    gl.position.set(0.678, 2.190, s * 0.166); group.add(gl);
  }

  /* ---- cycling helmet ---- */
  const helm = new THREE.Mesh(new THREE.SphereGeometry(0.205, 30, 20, 0, TAU, 0, Math.PI * 0.52), M.helmet);
  helm.position.set(0.575, 2.135, 0); helm.scale.set(1.02, 0.92, 0.98);
  helm.castShadow = true; group.add(helm);
  const visor = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.024, 0.24), M.frame);
  visor.position.set(0.775, 2.135, 0); visor.rotation.z = -0.22;
  visor.castShadow = true; group.add(visor);
  for (let i = 0; i < 4; i++){
    const vent = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.02, 0.032), M.frame);
    vent.position.set(0.50 + i * 0.055, 2.278 - i * 0.012, 0); group.add(vent);
  }

  /* ---- wings: an extruded silhouette plus splayed primaries ---- */
  const wingShape = new THREE.Shape();
  wingShape.moveTo(0, 0);
  wingShape.bezierCurveTo(-0.10,  0.13, -0.46,  0.20, -0.86,  0.115);
  wingShape.bezierCurveTo(-1.06,  0.065,-1.18, -0.045,-1.10, -0.135);
  wingShape.bezierCurveTo(-0.78, -0.255,-0.34, -0.245,-0.05, -0.125);
  wingShape.bezierCurveTo( 0.02, -0.085, 0.045,-0.03,  0,      0);
  const wingGeo = new THREE.ExtrudeGeometry(wingShape, {
    depth: 0.028, bevelEnabled: true, bevelSize: 0.014, bevelThickness: 0.013, bevelSegments: 2, curveSegments: 14,
  });
  wingGeo.translate(0, 0, -0.014);

  const wings = [];
  for (const s of [1, -1]){
    const pivot = new THREE.Group();
    pivot.position.set(0.04, 1.53, s * 0.285);
    const wing = new THREE.Mesh(wingGeo, M.feather);
    wing.castShadow = true;
    const prim = new THREE.Group();
    for (let i = 0; i < 7; i++){
      const f = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.020, 0.085), M.wingTip);
      f.position.set(-0.94 - i * 0.028, 0.005 - i * 0.012, -0.02 + i * 0.012);
      f.rotation.z = 0.05 + i * 0.02; f.rotation.y = -0.05 + i * 0.012;
      f.userData.phase = i * 0.55; f.castShadow = true;
      prim.add(f);
    }
    wing.add(prim);
    pivot.add(wing);
    pivot.scale.z = s;
    group.add(pivot);
    wings.push({ pivot, prim, side: s });
  }
  refs.wings = wings;

  /* ---- scarf, a live-updated ribbon ---- */
  const SEG = 24;
  const scarfGeo = new THREE.BufferGeometry();
  scarfGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array((SEG + 1) * 2 * 3), 3));
  const sIdx = [];
  for (let i = 0; i < SEG; i++){
    const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
    sIdx.push(a, c, b, b, c, d);
  }
  scarfGeo.setIndex(sIdx);
  const scarf = new THREE.Mesh(scarfGeo, M.scarf);
  scarf.frustumCulled = false;
  group.add(scarf);
  refs.scarf = { mesh: scarf, geo: scarfGeo, seg: SEG, anchor: new THREE.Vector3(0.31, 1.93, 0) };

  /* ---- legs: two-bone IK chains, one per pedal ---- */
  const legs = [];
  for (const s of [1, -1]){
    const hip = s > 0 ? HIP_L : HIP_R;
    const thigh = makeLimb(0.055, M.skin, 12);
    const shin  = makeLimb(0.038, M.skin, 12);
    const hipBall = new THREE.Mesh(new THREE.SphereGeometry(0.062, 14, 12), M.skin);
    const kneeBall = new THREE.Mesh(new THREE.SphereGeometry(0.048, 14, 12), M.skin);
    hipBall.castShadow = kneeBall.castShadow = true;
    group.add(hipBall, kneeBall);
    const foot  = new THREE.Group();
    const sole = new THREE.Mesh(new THREE.BoxGeometry(0.20, 0.028, 0.10), M.skin);
    sole.castShadow = true; foot.add(sole);
    for (let i = -1; i <= 1; i++){
      const toe = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.022, 0.035), M.skin);
      toe.position.set(0.13, 0, i * 0.032); toe.rotation.z = -0.1; foot.add(toe);
    }
    group.add(thigh, shin, foot);
    legs.push({ side: s, hip, thigh, shin, foot, hipBall, kneeBall });
  }
  refs.legs = legs;

  /* Per-frame pose. \`t\` is elapsed time, \`rig\` carries the riding state. */
  refs.update = (t, st) => {
    const bob = Math.sin(st.phase * 2) * 0.016 * st.moving + Math.sin(t * 1.7) * 0.004;
    group.position.y = bob;
    group.rotation.z = -0.015 * st.moving + Math.sin(st.phase * 2 + 1) * 0.012 * st.moving;

    // neck / head sway
    neck.rotation.z = Math.sin(t * 2.1) * 0.022 * st.moving;
    head.rotation.z = Math.sin(t * 2.4 + 0.6) * 0.06 - 0.04 * st.moving;
    head.rotation.y = Math.sin(t * 0.9) * 0.10;
    helm.rotation.copy(head.rotation);
    visor.rotation.copy(head.rotation);

    // pouch jiggle, scaled by road speed
    const j = Math.sin(t * 13) * 0.5 + Math.sin(t * 21 + 1.7) * 0.5;
    const amp = 0.028 + 0.075 * st.moving;
    pouch.scale.set(1 + j * amp * 0.30, 1 + j * amp, 1 + j * amp * 0.55);
    pouch.rotation.z = j * amp * 0.35;

    fish.rotation.z = -0.55 + Math.sin(t * 6) * 0.09 * st.moving;
    fish.rotation.y = Math.sin(t * 2.3) * 0.20;

    // tail flick
    tail.rotation.z = 0.30 + Math.sin(t * 3.1) * 0.06;
    tail.rotation.y = Math.sin(t * 2.2) * 0.05;

    // wings: glide, with periodic flaps
    const flapGate = 0.5 + 0.5 * Math.sin(t * 0.55 - 1.2);
    const flapAmt = Math.pow(clamp(flapGate, 0, 1), 6);
    const flap = Math.sin(t * 7.5) * flapAmt;
    for (const w of refs.wings){
      const glide = 0.13 + 0.07 * Math.sin(t * 1.1 + (w.side > 0 ? 0 : 0.8));
      w.pivot.rotation.x = w.side * (glide + flap * 0.85);
      w.pivot.rotation.y = w.side * (0.26 + 0.05 * Math.sin(t * 1.3));
      w.pivot.rotation.z = -0.10 + flap * 0.10;
      w.prim.children.forEach((f, i) => {
        f.rotation.x = Math.sin(t * 5.5 - f.userData.phase) * (0.06 + 0.22 * flapAmt);
      });
    }

    // scarf ribbon
    const sc = refs.scarf, pos = sc.geo.attributes.position.array;
    const wind = 6.5 + st.moving * 7.0;
    for (let i = 0; i <= sc.seg; i++){
      const u = i / sc.seg;
      const x = sc.anchor.x - u * 1.05;
      const y = sc.anchor.y + Math.sin(u * 5.2 - t * wind) * 0.085 * u - u * u * 0.22;
      const z = Math.sin(u * 4.1 - t * wind * 0.85) * 0.16 * u * (0.5 + st.moving);
      const hw = 0.072 * (1 - 0.42 * u * u);
      const a = i * 6;
      pos[a] = x; pos[a + 1] = y + hw; pos[a + 2] = z;
      pos[a + 3] = x; pos[a + 4] = y - hw; pos[a + 5] = z;
    }
    sc.geo.attributes.position.needsUpdate = true;
    sc.geo.computeVertexNormals();
  };

  return refs;
}

/* ============================================================================
   4 · THE BICYCLE
   ========================================================================== */
progress(2, '焊接自行车');

const R_WHEEL = 0.42;
const BB      = new THREE.Vector3(-0.08, 0.42, 0);
const CRANK_R = 0.165;
const PEDAL_Z = 0.115;

function buildWheel(){
  const g = new THREE.Group();
  const tire = new THREE.Mesh(new THREE.TorusGeometry(R_WHEEL, 0.048, 14, 64), M.rubber);
  tire.castShadow = true; g.add(tire);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(R_WHEEL - 0.055, 0.028, 10, 56), M.chrome);
  rim.castShadow = true; g.add(rim);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.042, 0.10, 14), M.chrome);
  hub.rotation.x = Math.PI / 2; g.add(hub);
  const spokeMat = new THREE.MeshStandardMaterial({ color: 0xc8d2e0, roughness: 0.25, metalness: 1 });
  const N = 24;
  for (let i = 0; i < N; i++){
    const a = (i / N) * TAU, off = (i % 2) ? 0.032 : -0.032;
    const s = new THREE.Mesh(new THREE.CylinderGeometry(0.0045, 0.0045, R_WHEEL - 0.06, 5), spokeMat);
    s.position.set(Math.cos(a) * (R_WHEEL - 0.06) / 2, Math.sin(a) * (R_WHEEL - 0.06) / 2, off);
    s.rotation.z = a - Math.PI / 2;
    g.add(s);
  }
  // a reflector that catches the bloom pass
  const ref = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.02, 0.03),
    new THREE.MeshStandardMaterial({ color: 0xffb347, emissive: 0xff9a1f, emissiveIntensity: 0.9, roughness: 0.3 }));
  ref.position.set(R_WHEEL - 0.085, 0, 0); g.add(ref);
  return g;
}

function buildBicycle(){
  const group = new THREE.Group();
  const P = {
    rearHub : new THREE.Vector3(-0.64, R_WHEEL, 0),
    frontHub: new THREE.Vector3( 0.64, R_WHEEL, 0),
    seatTop : new THREE.Vector3(-0.34, 1.02, 0),
    headTop : new THREE.Vector3( 0.50, 1.02, 0),
    headBot : new THREE.Vector3( 0.565, 0.74, 0),
    bar     : new THREE.Vector3( 0.545, 1.075, 0),
  };
  const tube = (a, b, r) => { const m = strut(a, b, r, M.frame, 12); group.add(m); return m; };

  tube(BB, P.rearHub, 0.024);                       // chain stay
  tube(BB, P.seatTop, 0.026);                       // seat tube
  tube(P.seatTop, P.rearHub, 0.018);                // seat stay
  tube(BB, P.headBot, 0.030);                       // down tube
  tube(P.seatTop, P.headTop, 0.026);                // top tube
  tube(P.headTop, P.headBot, 0.032);                // head tube
  for (const s of [1, -1]) tube(P.headBot, P.frontHub.clone().setZ(s * 0.055), 0.017); // fork blades

  // seat post + saddle
  tube(P.seatTop, new THREE.Vector3(-0.355, 1.10, 0), 0.016);
  const sadShape = new THREE.Shape();
  sadShape.moveTo(-0.20, 0); sadShape.lineTo(-0.09, 0.075); sadShape.lineTo(0.10, 0.085);
  sadShape.lineTo(0.18, 0.045); sadShape.lineTo(0.16, -0.045); sadShape.lineTo(0.10, -0.085);
  sadShape.lineTo(-0.09, -0.075); sadShape.lineTo(-0.20, 0);
  const saddle = new THREE.Mesh(new THREE.ExtrudeGeometry(sadShape, {
    depth: 0.05, bevelEnabled: true, bevelSize: 0.02, bevelThickness: 0.02, bevelSegments: 2 }),
    new THREE.MeshStandardMaterial({ color: 0x1d2230, roughness: 0.55, metalness: 0.2 }));
  saddle.rotation.x = -Math.PI / 2; saddle.position.set(-0.33, 1.105, 0.025);
  saddle.castShadow = true; group.add(saddle);

  // stem + handlebar + grips
  tube(P.headTop, P.bar, 0.02);
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.017, 0.017, 0.58, 12), M.chrome);
  bar.rotation.x = Math.PI / 2; bar.position.copy(P.bar); bar.castShadow = true; group.add(bar);
  for (const s of [1, -1]){
    const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.024, 0.14, 12),
      new THREE.MeshStandardMaterial({ color: 0x232838, roughness: 0.85 }));
    grip.rotation.x = Math.PI / 2; grip.position.set(P.bar.x, P.bar.y, s * 0.225);
    grip.castShadow = true; group.add(grip);
    const lever = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.016, 0.016), M.chrome);
    lever.position.set(P.bar.x + 0.07, P.bar.y - 0.03, s * 0.185); lever.rotation.z = -0.2; group.add(lever);
  }

  // wheels
  const wheels = [];
  for (const h of [P.rearHub, P.frontHub]){
    const w = buildWheel(); w.position.copy(h); group.add(w); wheels.push(w);
  }
  // mudguards
  for (const h of [P.rearHub, P.frontHub]){
    const mg = new THREE.Mesh(new THREE.TorusGeometry(R_WHEEL + 0.045, 0.012, 8, 32, Math.PI * 0.62), M.chrome);
    mg.position.copy(h); mg.rotation.z = Math.PI * 0.19; group.add(mg);
  }

  // crank set
  const crank = new THREE.Group(); crank.position.copy(BB); group.add(crank);
  const chainring = new THREE.Mesh(new THREE.TorusGeometry(0.115, 0.014, 8, 40), M.chrome);
  crank.add(chainring);
  const spider = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.05, 12), M.chrome);
  spider.rotation.x = Math.PI / 2; crank.add(spider);
  const pedals = [];
  for (const s of [1, -1]){
    const arm = new THREE.Group(); arm.rotation.z = s > 0 ? 0 : Math.PI; crank.add(arm);
    const armMesh = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.045, 0.022), M.frame);
    armMesh.position.set(0.075, 0, s * 0.075); armMesh.castShadow = true; arm.add(armMesh);
    const pivot = new THREE.Group(); pivot.position.set(CRANK_R, 0, s * PEDAL_Z); arm.add(pivot);
    const pedal = new THREE.Mesh(new THREE.BoxGeometry(0.095, 0.018, 0.075),
      new THREE.MeshStandardMaterial({ color: 0x2a3040, roughness: 0.7, metalness: 0.3 }));
    pedal.castShadow = true; pivot.add(pedal);
    pedals.push({ side: s, arm, pivot, pedal, z: s * PEDAL_Z });
  }
  // chain loop
  const cog = new THREE.Mesh(new THREE.TorusGeometry(0.048, 0.010, 6, 24), M.chrome);
  cog.position.copy(P.rearHub); group.add(cog);
  for (const s of [1, -1]){
    const a = new THREE.Vector3(BB.x, BB.y + s * 0.115, 0.075);
    const b = new THREE.Vector3(P.rearHub.x, P.rearHub.y + s * 0.048, 0.075);
    const c = strut(a, b, 0.008, new THREE.MeshStandardMaterial({ color: 0x59617a, roughness: 0.5, metalness: 0.9 }), 4, false);
    group.add(c);
  }

  return { group, wheels, crank, pedals, P };
}

/* ---------------------------------------------------------------------------
   Custom bloom.  The stock UnrealBloomPass composites with hardware additive
   blending into a half-float target, which several ANGLE/D3D drivers render
   incorrectly (the base image is lost).  This pass does the same job but adds
   the glow inside the fragment shader, so no hardware blending is involved.
   --------------------------------------------------------------------------- */
const QUAD_VERT = `
  varying vec2 vUv;
  void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
`;
const BRIGHT_FRAG = `
  uniform sampler2D tDiffuse;
  uniform float uThreshold, uKnee;
  varying vec2 vUv;
  void main(){
    vec3 c = texture2D(tDiffuse, vUv).rgb;
    float l = max(max(c.r, c.g), c.b);
    float k = clamp((l - uThreshold) / max(uKnee, 1e-4), 0.0, 1.0);
    gl_FragColor = vec4(c * k * k, 1.0);
  }
`;
const BLUR_FRAG = `
  uniform sampler2D tDiffuse;
  uniform vec2 uDir, uTexel;
  varying vec2 vUv;
  void main(){
    vec2 o = uDir * uTexel;
    vec4 s  = texture2D(tDiffuse, vUv) * 0.2270270270;
    s += (texture2D(tDiffuse, vUv + o * 1.3846153846) + texture2D(tDiffuse, vUv - o * 1.3846153846)) * 0.3162162162;
    s += (texture2D(tDiffuse, vUv + o * 3.2307692308) + texture2D(tDiffuse, vUv - o * 3.2307692308)) * 0.0702702703;
    gl_FragColor = s;
  }
`;
const COMPOSITE_FRAG = `
  uniform sampler2D tScene, tBloom;
  uniform float uStrength;
  varying vec2 vUv;
  void main(){
    vec4 scene = texture2D(tScene, vUv);
    vec3 glow  = texture2D(tBloom, vUv).rgb;
    gl_FragColor = vec4(scene.rgb + glow * uStrength, scene.a);
  }
`;

class BloomPass extends Pass {
  constructor(strength = 0.6, threshold = 0.78, knee = 0.35){
    super();
    this.strength = strength; this.threshold = threshold; this.knee = knee;
    const opts = {
      type: THREE.HalfFloatType, format: THREE.RGBAFormat,
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      depthBuffer: false, stencilBuffer: false,
    };
    this.rtBright = new THREE.WebGLRenderTarget(8, 8, opts);
    this.rtA = new THREE.WebGLRenderTarget(8, 8, opts);
    this.rtB = new THREE.WebGLRenderTarget(8, 8, opts);
    this.matBright = new THREE.ShaderMaterial({
      uniforms: { tDiffuse: { value: null }, uThreshold: { value: threshold }, uKnee: { value: knee } },
      vertexShader: QUAD_VERT, fragmentShader: BRIGHT_FRAG, depthTest: false, depthWrite: false,
    });
    this.matBlur = new THREE.ShaderMaterial({
      uniforms: { tDiffuse: { value: null }, uDir: { value: new THREE.Vector2(1, 0) }, uTexel: { value: new THREE.Vector2() } },
      vertexShader: QUAD_VERT, fragmentShader: BLUR_FRAG, depthTest: false, depthWrite: false,
    });
    this.matComposite = new THREE.ShaderMaterial({
      uniforms: { tScene: { value: null }, tBloom: { value: null }, uStrength: { value: strength } },
      vertexShader: QUAD_VERT, fragmentShader: COMPOSITE_FRAG, depthTest: false, depthWrite: false,
    });
    this.quad = new FullScreenQuad(this.matBright);
    this.needsSwap = true;
    this._size = new THREE.Vector2(8, 8);
  }
  setSize(width, height){
    const w = Math.max(4, Math.floor(width / 2)), h = Math.max(4, Math.floor(height / 2));
    this._size.set(w, h);
    this.rtBright.setSize(w, h); this.rtA.setSize(w, h); this.rtB.setSize(w, h);
  }
  _blit(renderer, material, target, inputTex){
    this.quad.material = material;
    (material.uniforms.tDiffuse || material.uniforms.tScene).value = inputTex;
    renderer.setRenderTarget(target);
    renderer.clear();
    this.quad.render(renderer);
  }
  render(renderer, writeBuffer, readBuffer){
    const prevAutoClear = renderer.autoClear;
    renderer.autoClear = false;

    // 1 · isolate the highlights at half resolution
    this.matBright.uniforms.uThreshold.value = this.threshold;
    this.matBright.uniforms.uKnee.value = this.knee;
    this._blit(renderer, this.matBright, this.rtBright, readBuffer.texture);

    // 2 · two widening separable Gaussian passes
    let src = this.rtBright.texture;
    for (const radius of [1.0, 2.4]){
      const texel = this.matBlur.uniforms.uTexel.value;
      texel.set(radius / this._size.x, radius / this._size.y);
      this.matBlur.uniforms.uDir.value.set(1, 0);
      this._blit(renderer, this.matBlur, this.rtA, src);
      this.matBlur.uniforms.uDir.value.set(0, 1);
      this._blit(renderer, this.matBlur, this.rtB, this.rtA.texture);
      src = this.rtB.texture;
    }

    // 3 · add the glow back over the untouched scene
    this.matComposite.uniforms.uStrength.value = this.enabled === false ? 0 : this.strength;
    this.matComposite.uniforms.tScene.value = readBuffer.texture;
    this.matComposite.uniforms.tBloom.value = src;
    this.quad.material = this.matComposite;
    renderer.setRenderTarget(writeBuffer);
    renderer.clear();
    this.quad.render(renderer);

    renderer.autoClear = prevAutoClear;
  }
}

const bloom = new BloomPass(0.42, 0.86, 0.40);
bloom.setSize(window.innerWidth, window.innerHeight);
composer.addPass(bloom);

const GradeShader = {
  uniforms: {
    tDiffuse: { value: null }, uTime: { value: 0 }, uVignette: { value: 0.92 },
    uGrain: { value: 0.032 }, uAberration: { value: 0.0016 }, uSaturation: { value: 1.09 },
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uTime, uVignette, uGrain, uAberration, uSaturation;
    varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    void main(){
      vec2 d = vUv - 0.5;
      vec2 off = d * uAberration * (0.5 + dot(d, d) * 4.0);
      vec3 c;
      c.r = texture2D(tDiffuse, vUv + off).r;
      c.g = texture2D(tDiffuse, vUv).g;
      c.b = texture2D(tDiffuse, vUv - off).b;
      float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
      c = mix(vec3(l), c, uSaturation);
      float v = smoothstep(1.15, 0.28, length(d) * 1.62);
      c *= mix(1.0, v, uVignette);
      c += (hash(vUv * 941.0 + fract(uTime)) - 0.5) * uGrain;
      gl_FragColor = vec4(c, 1.0);
    }
  `,
};
const grade = new ShaderPass(GradeShader);
composer.addPass(grade);
composer.addPass(new OutputPass());

const C_DAY = new THREE.Color(0x9fc4e0), C_DUSK = new THREE.Color(0xe8a26b),
      C_NIGHT = new THREE.Color(0x0a1226), C_SEA_D = new THREE.Color(0x0d2436),
      C_SEA_L = new THREE.Color(0x2f86b0), C_HEMI_D = new THREE.Color(0x2a3a5c);
const _fog = new THREE.Color();
let tod = 14;

function applyTod(h){
  tod = h;
  const ang = (h - 6) / 12 * Math.PI;
  const elev = Math.sin(ang) * 66;
  const azim = 104 + (h / 24) * 360;
  sunDir.setFromSphericalCoords(1, THREE.MathUtils.degToRad(90 - clamp(elev, -10, 90)), THREE.MathUtils.degToRad(azim));
  skyU.sunPosition.value.copy(sunDir);

  const up = clamp(sunDir.y * 1.7 + 0.12, 0, 1);
  const warm = clamp(1 - Math.abs(sunDir.y) / 0.32, 0, 1);

  sunLight.position.copy(sunDir).multiplyScalar(15);
  sunLight.position.y = Math.max(sunLight.position.y, 2.2);
  sunLight.target.position.set(-0.1, 0.9, 0);
  sunLight.intensity = 3.6 * up + 0.02;
  sunLight.color.setRGB(1, 1 - 0.26 * warm, 1 - 0.58 * warm);

  moonLight.intensity = 0.5 * (1 - up);
  hemi.intensity = 0.10 + 0.48 * up;
  hemi.color.copy(C_HEMI_D).lerp(C_DAY, up).lerp(C_DUSK, warm * 0.45);

  skyU.turbidity.value = lerp(3.6, 6.4, up);
  skyU.rayleigh.value = lerp(0.6, 2.9, up);
  skyU.mieCoefficient.value = lerp(0.004, 0.009, warm);

  _fog.copy(C_NIGHT).lerp(C_DAY, up).lerp(C_DUSK, warm * 0.6 * (0.35 + up));
  scene.fog.color.copy(_fog);
  renderer.toneMappingExposure = lerp(0.5, 0.93, up) + warm * 0.09;
  stars.material.opacity = clamp(1 - up * 1.9, 0, 1) * 0.92;
  seaMat.color.copy(C_SEA_D).lerp(C_SEA_L, up).lerp(C_DUSK, warm * 0.3);
  if (scene.environmentIntensity !== undefined) scene.environmentIntensity = 0.10 + 0.30 * up;

  const hh = Math.floor(((h % 24) + 24) % 24);
  $('#vTod').textContent = String(hh).padStart(2, '0') + ':' + String(Math.floor((h - Math.floor(h)) * 60)).padStart(2, '0');
}

/* ============================================================================
   9 · CAMERA DIRECTOR
   ========================================================================== */
const CAM_NAMES = { orbit: 'Orbit · 环绕', chase: 'Chase · 跟拍', cinema: 'Cinema · 电影', low: 'Low · 低角', top: 'Top · 俯瞰', beak: 'Beak POV · 喙视' };
let camMode = 'orbit';
const camLook = new THREE.Vector3(-0.02, 1.18, 0);
const _cp = new THREE.Vector3(), _cl = new THREE.Vector3(), _shake = new THREE.Vector3();
const ORBIT_HOME = new THREE.Vector3(4.55, 2.62, 6.15);

function setCamMode(m){
  camMode = m;
  document.querySelectorAll('[data-cam]').forEach(b => b.classList.toggle('on', b.dataset.cam === m));
  $('#vCam').textContent = CAM_NAMES[m] || m;
  controls.enabled = (m === 'orbit');
  if (m === 'orbit'){
    controls.target.set(-0.02, 1.18, 0);
    controls.update();
  } else {
    camLook.set(-0.02, 1.18, 0);
  }
}

function updateCamera(dt, t){
  if (camMode === 'orbit'){ controls.update(); return; }
  let px, py, pz, lx, ly, lz;
  if (camMode === 'chase'){
    px = -3.55 + Math.sin(t * 0.55) * 0.22; py = 1.58 + Math.sin(t * 1.15) * 0.06; pz = 0.10;
    lx = 0.45; ly = 1.48; lz = 0;
  } else if (camMode === 'cinema'){
    const a = t * 0.22;
    px = Math.cos(a) * 5.4; py = 1.95 + Math.sin(a * 0.75) * 1.25; pz = Math.sin(a) * 5.4;
    lx = 0.0; ly = 1.34; lz = 0;
  } else if (camMode === 'low'){
    px = 2.75 + Math.sin(t * 0.4) * 0.35; py = 0.30; pz = 2.05; lx = -0.30; ly = 1.10; lz = 0;
  } else if (camMode === 'top'){
    px = 0.06 + Math.sin(t * 0.3) * 0.5; py = 8.6; pz = 0.06; lx = -0.05; ly = 0.9; lz = 0;
  } else { // beak
    px = 0.58; py = 2.36; pz = 0.02; lx = 8.0; ly = 1.98; lz = 0;
  }
  _cp.set(px, py, pz);
  _cl.set(lx, ly, lz);
  _shake.set(Math.sin(t * 1.9) * 0.014, Math.sin(t * 2.6 + 1) * 0.011, Math.sin(t * 2.1 + 2) * 0.014);
  if (camMode !== 'beak') _cp.add(_shake);
  camera.position.lerp(_cp, 1 - Math.exp(-3.1 * dt));
  camLook.lerp(_cl, 1 - Math.exp(-4.2 * dt));
  camera.lookAt(camLook);
}

/* ============================================================================
   10 · SOUND  (wind + a bicycle bell, synthesised — no audio files)
   ========================================================================== */
let actx = null, windGain = null, bellClock = 0;
function initAudio(){
  if (actx) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC();
  } catch (e){ return; }
  const len = actx.sampleRate * 2;
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++){ const wn = Math.random() * 2 - 1; last = (last + 0.022 * wn) / 1.022; d[i] = last * 3.0; }
  const src = actx.createBufferSource(); src.buffer = buf; src.loop = true;
  const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 460; bp.Q.value = 0.65;
  windGain = actx.createGain(); windGain.gain.value = 0.0001;
  src.connect(bp); bp.connect(windGain); windGain.connect(actx.destination);
  src.start();
}
function ding(){
  if (!actx || !state.sound) return;
  if (actx.state === 'suspended') actx.resume();
  const t0 = actx.currentTime;
  [1870, 2800].forEach((fq, i) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = fq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.15 / (i + 1), t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.0 + i * 0.25);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + 1.6 + i * 0.25);
  });
}

/* ============================================================================
   11 · UI
   ========================================================================== */
const state = { speedKmh: 18, paused: false, auto: true, sound: true, bloom: true, wire: false };
const toastEl = $('#toast');
let toastTimer = 0;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

document.querySelectorAll('[data-cam]').forEach(b => b.addEventListener('click', () => {
  setCamMode(b.dataset.cam); toast(CAM_NAMES[b.dataset.cam]);
}));

$('#rSpeed').addEventListener('input', (e) => {
  state.speedKmh = +e.target.value;
  $('#vSpeed').textContent = state.speedKmh.toFixed(0) + ' km/h';
});
$('#rTod').addEventListener('input', (e) => applyTod(+e.target.value));

const tBloom = $('#tBloom'), tWire = $('#tWire'), tSound = $('#tSound'),
      tAuto = $('#tAuto'), tPause = $('#tPause'), tReset = $('#tReset');

tBloom.addEventListener('click', () => {
  state.bloom = !state.bloom; bloom.enabled = state.bloom;
  tBloom.classList.toggle('on', state.bloom); toast(state.bloom ? '辉光 ON' : '辉光 OFF');
});
tWire.addEventListener('click', () => {
  state.wire = !state.wire;
  scene.traverse(o => { if (o.isMesh && o.material && 'wireframe' in o.material) o.material.wireframe = state.wire; });
  tWire.classList.toggle('on', state.wire); toast(state.wire ? '线框 ON' : '线框 OFF');
});
tSound.addEventListener('click', () => {
  state.sound = !state.sound;
  tSound.classList.toggle('on', state.sound);
  if (state.sound){ initAudio(); ding(); toast('声音 ON'); } else toast('声音 OFF');
});
tAuto.addEventListener('click', () => {
  state.auto = !state.auto; controls.autoRotate = state.auto;
  tAuto.classList.toggle('on', state.auto); toast(state.auto ? '自动巡航 ON' : '自动巡航 OFF');
});
tPause.addEventListener('click', () => {
  state.paused = !state.paused;
  tPause.classList.toggle('on', state.paused);
  tPause.innerHTML = state.paused ? '<i>▶️</i>继续' : '<i>⏸️</i>暂停';
  toast(state.paused ? '已暂停' : '继续');
});
tReset.addEventListener('click', () => {
  state.speedKmh = 18; state.paused = false; state.auto = true; state.bloom = true;
  if (state.wire){ state.wire = false; tWire.classList.remove('on');
    scene.traverse(o => { if (o.isMesh && o.material && 'wireframe' in o.material) o.material.wireframe = false; }); }
  $('#rSpeed').value = 18; $('#vSpeed').textContent = '18 km/h';
  $('#rTod').value = 14; applyTod(14);
  bloom.enabled = true; tBloom.classList.add('on');
  tAuto.classList.add('on'); controls.autoRotate = true;
  tPause.classList.remove('on'); tPause.innerHTML = '<i>⏸️</i>暂停';
  controls.target.set(-0.02, 1.18, 0);
  camera.position.copy(ORBIT_HOME);
  setCamMode('orbit');
  toast('已重置');
});

$('#btnPanel').addEventListener('click', () => $('#panel').classList.toggle('hidden'));
$('#btnFull').addEventListener('click', toggleFull);
$('#btnShot').addEventListener('click', shot);

function shot(){
  composer.render();
  const a = document.createElement('a');
  a.download = 'pelican-bicycle-' + Date.now() + '.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
  toast('截图已保存 📸');
}
function toggleFull(){
  if (!document.fullscreenElement) canvas.parentElement.requestFullscreen && canvas.parentElement.requestFullscreen();
  else document.exitFullscreen && document.exitFullscreen();
}

controls.addEventListener('start', () => {
  if (state.auto){ state.auto = false; controls.autoRotate = false; tAuto.classList.remove('on'); }
});

window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'h'){ $('#panel').classList.toggle('hidden'); }
  else if (k === 's'){ shot(); }
  else if (k === 'f'){ toggleFull(); }
  else if (k === ' '){ e.preventDefault(); tPause.click(); }
  else if (k === 'n'){ const next = (tod + 3) % 24; $('#rTod').value = next; applyTod(next); toast('时间 ' + $('#vTod').textContent); }
  else if (e.key === 'ArrowLeft'){ const v = Math.max(0, +$('#rTod').value - 0.5); $('#rTod').value = v; applyTod(v); }
  else if (e.key === 'ArrowRight'){ const v = Math.min(24, +$('#rTod').value + 0.5); $('#rTod').value = v; applyTod(v); }
  else if (k >= '1' && k <= '6'){
    const m = ['orbit', 'chase', 'cinema', 'low', 'top', 'beak'][+k - 1];
    setCamMode(m); toast(CAM_NAMES[m]);
  }
});
window.addEventListener('pointerdown', () => { initAudio(); }, { once: false, passive: true });
window.addEventListener('keydown', () => { initAudio(); }, { once: true });

/* ============================================================================
   12 · RESIZE
   ========================================================================== */
function onResize(){
  const w = window.innerWidth, h = window.innerHeight, dpr = Math.min(window.devicePixelRatio || 1, 2);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setPixelRatio(dpr); renderer.setSize(w, h, false);
  composer.setPixelRatio(dpr); composer.setSize(w, h);
  bloom.setSize(w, h);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 120));

/* ============================================================================
   13 · MAIN LOOP
   ========================================================================== */
let last = performance.now() / 1000;
let T = 0, crankAngle = 0, wheelSpin = 0;
let fpsAcc = 0, fpsFrames = 0, hudClock = 0;
const PEDAL_L = new THREE.Vector3(), PEDAL_R = new THREE.Vector3();
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3();

function step(dt){
  if (state.paused) dt = 0; else T += dt;
  if (dt > 0){ grade.uniforms.uTime.value = T; }

  const kmh = state.speedKmh;
  const v = kmh / 3.6;
  const moving = clamp(kmh / 6, 0, 1);
  const wheelAngular = v / R_WHEEL;
  const crankAngular = wheelAngular / 2.55;
  if (dt > 0){ crankAngle = (crankAngle + crankAngular * dt) % TAU; wheelSpin += wheelAngular * dt; }

  /* --- bicycle ------------------------------------------------------------ */
  bike.crank.rotation.z = crankAngle;
  for (const w of bike.wheels) w.rotation.z = -wheelSpin;
  for (const p of bike.pedals) p.pivot.rotation.z = -(crankAngle + (p.side > 0 ? 0 : Math.PI));
  PEDAL_L.set(BB.x + Math.cos(crankAngle) * CRANK_R, BB.y + Math.sin(crankAngle) * CRANK_R, PEDAL_Z);
  PEDAL_R.set(BB.x - Math.cos(crankAngle) * CRANK_R, BB.y - Math.sin(crankAngle) * CRANK_R, -PEDAL_Z);

  /* --- pelican ------------------------------------------------------------ */
  bird.update(T, { moving: moving, cadence: crankAngular, phase: crankAngle });
  const bob = bird.group.position.y;
  for (const L of bird.legs){
    const tgt = L.side > 0 ? PEDAL_L : PEDAL_R;
    const fy = tgt.y + 0.026 - bob;
    const knee = solveIK({ x: L.hip.x, y: L.hip.y }, { x: tgt.x, y: fy }, THIGH, SHIN, 1);
    _v1.set(L.hip.x, L.hip.y, L.hip.z);
    _v2.set(knee.x, knee.y, L.hip.z);
    _v3.set(tgt.x, fy, tgt.z);
    L.thigh.pose(_v1, _v2);
    L.shin.pose(_v2, _v3);
    L.foot.position.copy(_v3);
    L.foot.rotation.z = 0.09 - bird.group.rotation.z;
    L.kneeBall.position.copy(_v2);
    L.hipBall.position.set(L.hip.x, L.hip.y, L.hip.z);
  }

  /* --- scrolling world ---------------------------------------------------- */
  const scroll = v * dt;
  if (dt > 0){
    roadTex.offset.x += scroll / (760 / 64);
    seaBump.offset.x = T * 0.0035;
    seaBump.offset.y = Math.sin(T * 0.09) * 0.03;
    for (const p of props){
      p.position.x -= scroll * 1.0;
      if (p.position.x < -86){
        p.position.x += 172;
        p.position.z = (RNG() > 0.5 ? 1 : -1) * rand(6.5, 27);
        p.rotation.y = rand(0, TAU);
        p.scale.setScalar(rand(0.8, 1.3));
      }
    }
    for (const m of hills.children){
      m.position.x -= scroll * 0.13;
      if (m.position.x < -660) m.position.x += 1320;
    }
    for (const c of clouds.children){
      c.rotation.y += c.userData.spin * dt;
      c.position.x -= scroll * 0.055 + dt * 0.55;
      if (c.position.x < -390) c.position.x += 780;
    }
    stars.rotation.y += dt * 0.004;
    for (const g of gulls.children){
      g.position.x -= (v * 0.3 + 1.0) * dt;
      if (g.position.x < -130) g.position.x += 260;
      const fl = Math.sin(T * 6.5 + g.userData.seed) * 0.62;
      g.userData.wL.rotation.x = fl;
      g.userData.wR.rotation.x = fl;
      g.rotation.z = Math.sin(T * 0.9 + g.userData.seed) * 0.14;
    }
    // dust
    for (let i = 0; i < DUST; i++){
      dustLife[i] -= dt;
      if (dustLife[i] <= 0){ seedDust(i, moving); continue; }
      dustPos[i * 3]     += (dustVel[i * 3] - v * 0.34) * dt;
      dustPos[i * 3 + 1] += dustVel[i * 3 + 1] * dt;
      dustPos[i * 3 + 2] += dustVel[i * 3 + 2] * dt;
      dustVel[i * 3 + 1] -= 0.85 * dt;
    }
    dustGeo.attributes.position.needsUpdate = true;
  }
  dustMat.opacity = 0.08 + 0.5 * moving;

  /* --- camera, lights, audio ---------------------------------------------- */
  updateCamera(dt || 0.016, T);
  sunLight.position.copy(sunDir).multiplyScalar(15);
  sunLight.position.y = Math.max(sunLight.position.y, 2.2);
  if (windGain && actx){
    const target = state.sound ? 0.006 + 0.075 * moving * clamp(kmh / 30, 0.2, 1.4) : 0.0001;
    windGain.gain.value = damp(windGain.gain.value, target, 2.4, dt || 0.016);
  }
  if (!state.paused && state.sound && actx){
    bellClock += dt;
    if (bellClock > 6.5 && moving > 0.4){ bellClock = 0; ding(); }
  }

  composer.render();

  /* --- hud ---------------------------------------------------------------- */
  fpsAcc += dt || 0.016; fpsFrames++;
  hudClock += dt || 0.016;
  if (hudClock > 0.4){
    const fps = fpsFrames / Math.max(fpsAcc, 1e-4);
    $('#hFps').textContent = fps.toFixed(0);
    $('#hSpeed').innerHTML = state.speedKmh.toFixed(0) + '<small> km/h</small>';
    $('#hTris').textContent = (renderer.info.render.triangles / 1000).toFixed(1) + 'k';
    fpsAcc = 0; fpsFrames = 0; hudClock = 0;
  }
}

function frame(nowMs){
  requestAnimationFrame(frame);
  const now = nowMs / 1000;
  const dt = Math.min(0.05, Math.max(0, now - last));
  last = now;
  step(dt);
}

/* ============================================================================
   14 · BOOT
   ========================================================================== */
applyTod(14);
onResize();
$('#vSpeed').textContent = '18 km/h';
$('#vCam').textContent = CAM_NAMES.orbit;

(async () => {
  try { if (renderer.compileAsync) await renderer.compileAsync(scene, camera); }
  catch (e){ console.warn('precompile skipped', e); }
  composer.render();
  progress(7, '准备就绪');
  window.__pelican = { THREE, renderer, scene, camera, composer, controls, rig, bike, bird, state, applyTod, setCamMode, bloom, props, road, ground, sunLight, sky,
    EffectComposer, RenderPass, ShaderPass, OutputPass, GradeShader, seedDust, step, frame,
    clouds, gulls, dust, stars, hills, sea, renderer2: null,
    advance: (n, dt) => { for (let i = 0; i < n; i++) step(dt); } };
  requestAnimationFrame(frame);
  setTimeout(() => $('#loader').classList.add('done'), 260);
  setTimeout(() => toast('拖拽旋转 · 滚轮缩放 · 按 H 收起面板'), 1400);
})();



</script>
